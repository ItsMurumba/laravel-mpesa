name: Pre-release

on:
  push:
    branches: [develop]

permissions:
  contents: write

# One release at a time, so two merges can't pick the same version: a second run waits for the first.
concurrency:
  group: pre-release
  cancel-in-progress: false

jobs:
  pre-release:
    name: Create pre-release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get next pre-release version
        id: version
        run: |
          # Latest stable tag (vX.Y.Z); pre-releases such as v1.0.9-beta.1 or v2.0.0-rc.1 are skipped.
          LATEST=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)
          LATEST=${LATEST:-v1.0.8}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          BASE="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          # A release candidate above the next patch (e.g. v2.0.0-rc.1) sets the version develop is heading for.
          RC=$(git tag -l "v*-rc.*" | sed "s/-rc\..*//" | sort -V | tail -n1)
          if [ -n "$RC" ] && [ "$(printf "%s\n" "$BASE" "$RC" | sort -V | tail -n1)" = "$RC" ]; then BASE=$RC; fi
          # Composer accepts -beta.N (not -dev.N), so these can be installed. One past the highest existing number.
          LAST=$(git tag -l "${BASE}-beta.*" | sed "s/.*-beta\.//" | sort -n | tail -n1)
          VERSION="${BASE}-beta.$((${LAST:-0} + 1))"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pre-release version: ${VERSION}"

      - name: Create tag and pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }} (pre-release)
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
