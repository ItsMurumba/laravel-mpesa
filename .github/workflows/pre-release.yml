name: Pre-release

on:
  push:
    branches: [develop]

permissions:
  contents: write

# One release at a time, so two merges can't pick the same version: a second run waits for the first.
concurrency:
  group: pre-release
  cancel-in-progress: false

jobs:
  pre-release:
    name: Create pre-release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get next pre-release version
        id: version
        run: |
          # Latest stable tag (vX.Y.Z); pre-releases such as v1.0.9-dev.1 or v2.0.0-rc.1 are skipped.
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          LATEST=${LATEST:-v1.0.8}
          LATEST=${LATEST#v}
          PARTS=(${LATEST//./ })
          MAJOR=${PARTS[0]:-1}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-8}
          NEXT_PATCH=$((PATCH + 1))
          BASE="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          # One past the highest existing pre-release number for this base, so deleted tags leave no clash
          LAST=$(git tag -l "${BASE}-dev.*" | sed 's/.*-dev\.//' | sort -n | tail -n1)
          N=$((${LAST:-0} + 1))
          VERSION="${BASE}-dev.${N}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pre-release version: ${VERSION}"

      - name: Create tag and pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }} (pre-release)
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
