name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel-12:
    name: Laravel 12 · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LARAVEL_VERSION: "12.0"
      TESTBENCH_VERSION: "10.0"

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-12-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-12-composer-

      - name: Install dependencies (Laravel 12)
        run: |
          composer require --dev \
            "illuminate/support:^${LARAVEL_VERSION}" \
            "orchestra/testbench:^${TESTBENCH_VERSION}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  laravel-13:
    name: Laravel 13 · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LARAVEL_VERSION: "13.0"
      TESTBENCH_VERSION: "11.0"

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-13-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-13-composer-

      - name: Install dependencies (Laravel 13)
        run: |
          composer require --dev \
            "illuminate/support:^${LARAVEL_VERSION}" \
            "orchestra/testbench:^${TESTBENCH_VERSION}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

